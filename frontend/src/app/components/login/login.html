<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>Gerenciamento de Dispositivos</mat-card-title>
      <mat-card-subtitle>Faça login para continuar</mat-card-subtitle>
    </mat-card-header>
    
    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" placeholder="Digite seu email">
          <mat-error *ngIf="loginForm.get('email')?.hasError('required')">
            Email é obrigatório
          </mat-error>
          <mat-error *ngIf="loginForm.get('email')?.hasError('email')">
            Digite um email válido
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Senha</mat-label>
          <input matInput type="password" formControlName="password" placeholder="Digite sua senha">
          <mat-error *ngIf="loginForm.get('password')?.hasError('required')">
            Senha é obrigatória
          </mat-error>
          <mat-error *ngIf="loginForm.get('password')?.hasError('minlength')">
            Senha deve ter pelo menos 6 caracteres
          </mat-error>
        </mat-form-field>

        <div class="button-container">
          <button mat-raised-button color="primary" type="submit" 
                  [disabled]="loginForm.invalid || isLoading" class="full-width">
            <span *ngIf="isLoading">Entrando...</span>
            <span *ngIf="!isLoading">Entrar</span>
          </button>
        </div>
      </form>
    </mat-card-content>

    <mat-card-actions>
      <button mat-button color="accent" (click)="goToRegister()">
        Não tem conta? Registre-se
      </button>
    </mat-card-actions>
  </mat-card>

  <div class="demo-credentials">
    <mat-card class="demo-card">
      <mat-card-header>
        <mat-card-title>Credenciais de Demonstração</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <p><strong>Email:</strong> admin@example.com.br</p>
        <p><strong>Senha:</strong> 12345678</p>
        <p><strong>Ou:</strong></p>
        <p><strong>Email:</strong> teste@example.com.br</p>
        <p><strong>Senha:</strong> 12345678</p>
      </mat-card-content>
    </mat-card>
  </div>
</div>
